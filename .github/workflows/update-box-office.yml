name: Weekly Box Office Update

on:
  schedule:
    # Every Monday at 10:00 AM UTC (6 AM EST)
    - cron: '0 10 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-box-office:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch@3 cheerio@1.0.0

      - name: Scrape Box Office Mojo and update Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/update-box-office.mjs
